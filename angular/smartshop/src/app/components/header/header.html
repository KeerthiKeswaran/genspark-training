<header class="home-header" (click)="$event.stopPropagation()">
  <div class="header-left">
    <a routerLink="/home" class="logo-link" style="display: flex; align-items: center; text-decoration: none;">
      <img src="/assets/logo.png" alt="SmartShop Logo" class="header-logo" />
    </a>
    <div class="search-container" (click)="$event.stopPropagation()">
      <button class="search-icon-btn" (click)="triggerSearch()" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <input 
        type="text" 
        placeholder="Search products, categories, brands..." 
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        (focus)="onSearchFocus()"
        (keydown.enter)="triggerSearch()"
        class="search-input" 
      />

      <!-- Autocomplete Recommendations dropdown -->
      @if (showRecommendations() && recommendations().length > 0) {
        <div class="search-recommendations-dropdown">
          @for (prod of recommendations(); track prod.id) {
            <button class="recommendation-item" (click)="selectRecommendation(prod.id)">
              <img [src]="prod.thumbnail" [alt]="prod.title" class="rec-thumb" />
              <div class="rec-details">
                <span class="rec-title">{{ prod.title }}</span>
                <span class="rec-category">{{ prod.category }}</span>
              </div>
              <span class="rec-price">{{ prod.price | inrCurrency }}</span>
            </button>
          }
        </div>
      }
    </div>
  </div>

  <div class="header-right">
    @if (currentUser$ | async; as user) {
      <!-- Cart trigger button -->
      <button class="cart-trigger-btn" (click)="cartService.toggleCart()" aria-label="Open shopping cart">
        <div class="cart-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          @if (cartService.cartCount() > 0) {
            <span class="cart-badge">{{ cartService.cartCount() }}</span>
          }
        </div>
      </button>

      <div class="user-menu-wrapper">
        <button class="user-dropdown-btn" (click)="toggleDropdown($event)">
          <span class="welcome-text">Welcome, <strong class="username">{{ user.firstName }}</strong></span>
          <img [src]="user.image" alt="Profile Image" class="user-avatar" />
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon" [class.open]="isDropdownOpen()">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        @if (isDropdownOpen()) {
          <div class="dropdown-menu" (click)="$event.stopPropagation()">
            <div class="dropdown-header">
              <span class="user-full-name">{{ user.firstName }} {{ user.lastName }}</span>
              <span class="user-email">{{ user.email }}</span>
            </div>
            <div class="dropdown-divider"></div>
            
            <!-- My Profile -->
            <a routerLink="/profile" class="dropdown-item" (click)="closeDropdown()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="item-icon">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>My Profile</span>
            </a>

            <!-- My Orders -->
            <a href="#" class="dropdown-item" (click)="closeDropdown()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="item-icon">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
              </svg>
              <span>My Orders</span>
            </a>

            <!-- Settings -->
            <a href="#" class="dropdown-item" (click)="closeDropdown()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="item-icon">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
              <span>Settings</span>
            </a>

            <div class="dropdown-divider"></div>

            <!-- Logout -->
            <button class="dropdown-item logout-btn" (click)="logout()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="item-icon">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Sign Out</span>
            </button>
          </div>
        }
      </div>
    } @else {
      <a routerLink="/login" class="login-link-btn">Sign In</a>
    }
  </div>
</header>
