<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="/assets/logo.png" alt="SmartShop Logo" class="login-logo" />
    </div>

    @if (errorMessage()) {
      <div class="error-banner">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="error-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Username Field -->
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper" [class.error]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            type="text" 
            id="username" 
            formControlName="username" 
            placeholder="e.g., emilys" 
            autocomplete="username"
          />
        </div>
        @if (loginForm.get('username')?.touched && loginForm.get('username')?.invalid) {
          <span class="validation-message">
            Username is required (min 3 characters).
          </span>
        }
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper" [class.error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••" 
            autocomplete="current-password"
          />
        </div>
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
          <span class="validation-message">
            Password is required (min 4 characters).
          </span>
        }
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" [disabled]="isLoading() || loginForm.invalid">
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>

    <!-- <div class="demo-credentials">
      <p><strong>Demo Access:</strong> Use <code>emilys</code> and <code>emilyspass</code></p>
    </div> -->
  </div>
</div>
